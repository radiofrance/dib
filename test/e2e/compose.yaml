# Services needed by the end-to-end build scenarios, see docs/e2e-tests.md.
# buildkitd shares the registry network namespace: dib on the host and
# buildkitd both reach the registry at localhost:5000.
services:
  registry:
    image: "registry:3.1.2@sha256:38907510915c3f1604c7e83d6ab602ab3020d092f73bdaed8696773693ff768c"
    ports:
      - "127.0.0.1:5000:5000"
      - "127.0.0.1:1234:1234" # buildkitd
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5000/v2/"]
      interval: 2s
      retries: 30

  buildkitd:
    image: "moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c"
    privileged: true
    network_mode: "service:registry"
    command: ["--addr", "tcp://0.0.0.0:1234", "--config", "/etc/buildkit/buildkitd.toml"]
    volumes:
      - "./buildkitd.toml:/etc/buildkit/buildkitd.toml:ro"
    healthcheck:
      test: ["CMD", "buildctl", "--addr", "tcp://127.0.0.1:1234", "debug", "workers"]
      interval: 2s
      retries: 30
